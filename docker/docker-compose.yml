services:
  clickhouse:
    image: clickhouse:25.9
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP interface (for DbVisualizer or Python)
      - "9000:9000" # Native protocol interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse/
      - clickhouse_logs:/var/log/clickhouse-server/
    environment:
      - CLICKHOUSE_DB=brazilian_ecommerce
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=admin
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
  clickhouse_logs: